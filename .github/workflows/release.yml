name: Release verified backup image
on:
  push:
    tags: ['v*']
concurrency:
  group: backup-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    environment: backup-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: pip install -r requirements-dev.txt
      - run: |
          python scripts/check_unpublished.py
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          make lint test
          python scripts/check_charts.py
          docker build --platform linux/amd64 -t "soulgarden/backup:$(cat VERSION)" .
          python scripts/integration.py --image "soulgarden/backup:$(cat VERSION)"
          python scripts/test_logalert.py
          python scripts/test_client_matrix.py
      - name: Mandatory DigitalOcean fixture contract
        env:
          FIXTURE_BUCKET: ${{ vars.SPACES_FIXTURE_BUCKET }}
          FIXTURE_CANARY_BUCKET: ${{ vars.SPACES_FIXTURE_CANARY_BUCKET }}
          SCOPE_EVIDENCE: ${{ vars.SPACES_FIXTURE_SCOPE_EVIDENCE }}
          FIXTURE_ACCESS_KEY: ${{ secrets.SPACES_FIXTURE_ACCESS_KEY }}
          FIXTURE_SECRET_KEY: ${{ secrets.SPACES_FIXTURE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib,tempfile,json,subprocess
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp)
              for key,env in [('access_key','FIXTURE_ACCESS_KEY'),('secret_key','FIXTURE_SECRET_KEY')]:
                  (p/key).write_text(os.environ[env]);(p/key).chmod(0o444)
              (p/'scope.json').write_text(os.environ['SCOPE_EVIDENCE']);(p/'scope.json').chmod(0o444)
              p.chmod(0o755)
              version=pathlib.Path('VERSION').read_text().strip()
              cmd=['docker','run','--rm','--entrypoint','python','--mount',f'type=bind,src={p},dst=/credentials,readonly','--mount',f'type=bind,src={pathlib.Path.cwd()},dst=/source',f'soulgarden/backup:{version}','/source/scripts/provider_contract.py','--bucket',os.environ['FIXTURE_BUCKET'],'--canary-bucket',os.environ['FIXTURE_CANARY_BUCKET'],'--credentials-dir','/credentials','--scope-evidence','/credentials/scope.json','--report','/work/provider.json']
              # Copy only the report through stdout, not credentials.
              # /source/artifacts is writable by the non-root release image.
              pathlib.Path('artifacts').chmod(0o777)
              cmd[-1]='/source/artifacts/provider.json'
              subprocess.run(cmd,check=True)
          PY
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the same tested image
        run: |
          image="soulgarden/backup:$(cat VERSION)"
          python scripts/check_unpublished.py
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > artifacts/published-digest.json
          git rev-parse HEAD > artifacts/commit.txt
          cp VERSION artifacts/VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/
