{{- if not .Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup.fullname" . }}-config
  labels:
    {{- include "backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.configKey | quote }}: |
    [default]
    access_key = {{ .Values.s3.access_key }}
    secret_key = {{ .Values.s3.secret_key }}
    access_token = {{ .Values.s3.access_token }}
    gpg_passphrase = {{ .Values.s3.gpg_passphrase }}
    bucket_location = {{ .Values.s3.bucket_location }}
    host_base = {{ .Values.s3.host_base }}
    host_bucket = {{ .Values.s3.host_bucket }}
    website_endpoint = {{ .Values.s3.website_endpoint }}
    use_https = True
    check_ssl_certificate = True
    check_ssl_hostname = True
    signature_v2 = False
    encrypt = False
{{- end }}
{{- if not .Values.pg.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup.fullname" . }}-postgres
  labels:
    {{- include "backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.pg.passwordKey | quote }}: {{ .Values.pg.password | quote }}
{{- end }}
