{{- if not .Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup.fullname" . }}-s3-sdk
  labels:
    {{- include "backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.accessKeyKey }}: {{ .Values.s3.accessKey | quote }}
  {{ .Values.s3.secretKeyKey }}: {{ .Values.s3.secretKey | quote }}
  {{- if .Values.s3.sessionTokenKey }}
  {{ .Values.s3.sessionTokenKey }}: {{ .Values.s3.sessionToken | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.pg.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup.fullname" . }}-postgres
  labels:
    {{- include "backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.pg.passwordKey }}: {{ .Values.pg.password | quote }}
{{- end }}
{{- if .Values.legacySecret.enabled }}
{{- if or .Values.s3.existingSecret .Values.pg.existingSecret }}
{{- fail "Generate rollback Secret before switching to externally managed credentials" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.legacySecret.name }}
  labels:
    {{- include "backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  pg-password: {{ .Values.pg.password | quote }}
  .s3cfg: |
    [default]
    access_key = {{ .Values.s3.accessKey }}
    secret_key = {{ .Values.s3.secretKey }}
    access_token = {{ .Values.s3.sessionToken }}
    host_base = {{ .Values.s3.endpoint | trimPrefix "https://" | trimSuffix "/" }}
    host_bucket = %(bucket)s.{{ .Values.s3.endpoint | trimPrefix "https://" | trimSuffix "/" }}
    bucket_location = US
    use_https = True
    check_ssl_certificate = True
    check_ssl_hostname = True
    signature_v2 = False
    encrypt = False
{{- end }}
