image:
  repository: soulgarden/backup
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

schedule: "30 23 */3 * *"
# Leave empty to keep the controller's local time zone.
timeZone: ""
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
backoffLimit: 6

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}

volumes: []
volumeMounts: []

# Preserve the original scheduling constraint; override with {} to allow any node.
nodeSelector:
  shared: "true"
tolerations: []
affinity: {}

pg:
  name: dbname
  user: user
  host: 127.0.0.1
  port: 5432
  # Prefer an existing Secret containing the database password.
  existingSecret: ""
  passwordKey: PGPASSWORD
  password: ""

s3:
  bucket: bucket
  # Prefer an existing Secret containing a complete .s3cfg file.
  existingSecret: ""
  configKey: .s3cfg
  access_key: ""
  secret_key: ""
  access_token: ""
  gpg_passphrase: ""
  bucket_location: US
  host_base: ams3.digitaloceanspaces.com
  host_bucket: "%(bucket)s.ams3.digitaloceanspaces.com"
  website_endpoint: "http://%(bucket)s.ams3.digitaloceanspaces.com"
