image:
  repository: soulgarden/backup
  pullPolicy: IfNotPresent
  tag: 0.2.0
  digest: ''
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
nodeSelector:
  shared: 'true'
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
pg:
  name: dbname
  user: user
  host: 127.0.0.1
  port: 5432
  existingSecret: ''
  passwordKey: PGPASSWORD
  password: ''
schedule: 30 23 */3 * *
timeZone: Etc/UTC
suspend: true
concurrencyPolicy: Forbid
cronjob:
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 86400
  activeDeadlineSeconds: 10800
  terminationGracePeriodSeconds: 90
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
workspace:
  sizeLimit: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 8Gi
  limits:
    cpu: '2'
    memory: 1Gi
    ephemeral-storage: 12Gi
configVersion: 2
postgresql:
  majorVersion: 16
  targetServerMajor: 16
  connectTimeoutSeconds: 10
  lockWaitTimeoutSeconds: 60
backup:
  includeSchemas: []
  excludeSchemas: []
  excludeTables: []
  excludeTableData: []
  includeLargeObjects: true
  includeAcl: true
  strictNames: true
  compressionLevel: 6
validation:
  requiredSchemas: []
  requiredTables: []
  minTableDataEntries: 0
s3:
  endpoint: https://ams3.digitaloceanspaces.com
  region: us-east-1
  bucket: example-backups
  prefix: example/v2/
  addressingStyle: virtual
  signatureVersion: s3v4
  connectTimeoutSeconds: 10
  readTimeoutSeconds: 30
  totalAttempts: 3
  multipartThresholdMiB: 64
  multipartChunkSizeMiB: 16
  maxConcurrency: 2
  readChunkMiB: 8
  requestChecksumCalculation: when_required
  responseChecksumValidation: when_required
  existingSecret: ''
  accessKeyKey: AWS_ACCESS_KEY_ID
  secretKeyKey: AWS_SECRET_ACCESS_KEY
  sessionTokenKey: AWS_SESSION_TOKEN
  accessKey: ''
  secretKey: ''
  sessionToken: ''
process:
  shutdownGraceSeconds: 45
retention:
  enabled: false
  dryRun: true
  deletionApproved: false
  maxAgeDays: 365
  keepLast: 7
  incompleteRunMaxAgeDays: 7
  legacy:
    enabled: false
    dryRun: true
    prefix: ''
    filenamePattern: ''
    minVerifiedV2Sets: 7
observability:
  sizeAnomaly:
    historySamples: 7
    minSamples: 3
    minRatio: 0.5
    maxRatio: 2.0
legacySecret:
  enabled: false
  name: backup-config
releaseGates:
  requireDigest: false
  providerContractVerified: false
  multipartLifecycleVerified: false
